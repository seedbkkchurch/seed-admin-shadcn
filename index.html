<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Logo replaced 2026-08-25 (grill-me) — new artwork is a raster
         illustration (not vector), and looks the same on white in both
         color schemes, so the separate light/dark SVG variants that the
         old line-icon logo needed were dropped; one PNG covers both. -->
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Seed Admin — ระบบจัดการสมาชิกคริสตจักร Seed Church</title>
    <meta
      name="title"
      content="Seed Admin — ระบบจัดการสมาชิกคริสตจักร Seed Church"
    />
    <meta
      name="description"
      content="ระบบบริหารจัดการสมาชิกคริสตจักร Seed Church — ติดตามการเติบโตฝ่ายวิญญาณของสมาชิก (Lamb), การเข้าร่วมกลุ่มแคร์และการเฝ้าเดี่ยว, สถิติการเข้าร่วมนมัสการ, พระคัมภีร์ออนไลน์หลายฉบับ และข่าวสารคริสตจักร ครบในที่เดียว"
    />

    <!-- Open Graph / Facebook -->
    <!-- OG image/meta rewritten 2026-08-26 (grill-me): domain moved to
         admin.seedchurchth.org, site_name added, title/description now
         describe the actual church-membership app instead of the old
         Shadcn template copy, and og-seed-admin.jpg replaces the
         206x275/transparent-bg image that OG validators flagged as
         invalid (now 1200x630, white bg, ~50KB JPEG). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seed Admin" />
    <meta property="og:url" content="https://admin.seedchurchth.org/" />
    <meta
      property="og:title"
      content="Seed Admin — ระบบจัดการสมาชิกคริสตจักร Seed Church"
    />
    <meta
      property="og:description"
      content="ระบบบริหารจัดการสมาชิกคริสตจักร Seed Church — ติดตามการเติบโตฝ่ายวิญญาณของสมาชิก (Lamb), การเข้าร่วมกลุ่มแคร์และการเฝ้าเดี่ยว, สถิติการเข้าร่วมนมัสการ, พระคัมภีร์ออนไลน์หลายฉบับ และข่าวสารคริสตจักร ครบในที่เดียว"
    />
    <meta
      property="og:image"
      content="https://admin.seedchurchth.org/images/og-seed-admin.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://admin.seedchurchth.org/" />
    <meta
      property="twitter:title"
      content="Seed Admin — ระบบจัดการสมาชิกคริสตจักร Seed Church"
    />
    <meta
      property="twitter:description"
      content="ระบบบริหารจัดการสมาชิกคริสตจักร Seed Church — ติดตามการเติบโตฝ่ายวิญญาณของสมาชิก (Lamb), การเข้าร่วมกลุ่มแคร์และการเฝ้าเดี่ยว, สถิติการเข้าร่วมนมัสการ, พระคัมภีร์ออนไลน์หลายฉบับ และข่าวสารคริสตจักร ครบในที่เดียว"
    />
    <meta
      property="twitter:image"
      content="https://admin.seedchurchth.org/images/og-seed-admin.jpg"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=IBM+Plex+Sans+Thai+Looped:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />

    <!-- PWA / "Add to Home Screen" (grill-me follow-up, 2026-08-11) -->
    <!-- iOS Safari ignores manifest.webmanifest for install metadata, so
         these meta tags are needed in addition to the manifest that
         vite-plugin-pwa injects at build time. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Seed Admin" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
